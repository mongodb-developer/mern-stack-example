version: '3.8'
services:
  frontend:
    build: ./client
    ports:
      - "8080:8080"
    networks:
      - middleware
  server:
    build: ./server
    ports:
      - "5050:5050"
    env_file:
      - ./server/config.env
    networks:
      - middleware
networks:
  middleware:     
    driver: bridge 